<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在前往網易雲音樂｜作品專屬配樂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", sans-serif;
      background: #121212;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #1c1c1e;
      border: 1px solid #2e2e32;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    p {
      font-size: 14px;
      color: #b5b5bd;
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: #e60026;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      background: #2a2a2e;
      color: #e5e5ea;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .hint {
      font-size: 12px;
      color: #8e8e93;
      line-height: 1.5;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">NFC 畫作專屬配樂</div>
    <h1>正在喚起網易雲音樂</h1>
    <p>本頁面用於引導開啟你所收藏畫作的專屬曲目。若未自動跳轉，請點擊下方按鈕。</p>

    <a id="openAppBtn" class="btn-primary" href="#">開啟網易雲音樂 App</a>
    <a id="openWebBtn" class="btn-secondary" href="#" target="_blank" rel="noopener noreferrer">在瀏覽器開啟網易雲網頁版</a>

    <p class="hint">
      若手機尚未安裝網易雲音樂，可先點選「在瀏覽器開啟網易雲網頁版」聆聽，或前往應用商店下載網易雲音樂。
    </p>
  </main>

  <script>
    // 只要修改這裡的歌曲 ID 即可套用到不同曲目
    const SONG_ID = "3448915427";

    const appSchemeUrl = `orpheus://song/${SONG_ID}`;
    const webUrl = `https://music.163.com/#/song?id=${SONG_ID}`;

    const openAppBtn = document.getElementById("openAppBtn");
    const openWebBtn = document.getElementById("openWebBtn");

    openAppBtn.href = appSchemeUrl;
    openWebBtn.href = webUrl;

    // 頁面開啟後嘗試自動喚起網易雲音樂 App
    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.href = appSchemeUrl;
      }, 250);
    });
  </script>
</body>
</html>
